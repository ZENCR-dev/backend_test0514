name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18.x'
  
jobs:
  # ==================== 代码质量检查 ====================
  code-quality:
    name: 代码质量检查
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: ESLint检查
      run: npm run lint:check
      
    - name: TypeScript类型检查
      run: npx tsc --noEmit
      
    - name: Prettier格式检查
      run: npx prettier --check "src/**/*.{ts,js,json}"
      
    - name: Prisma schema验证
      run: npx prisma validate

  # ==================== 测试 ====================
  test:
    name: 运行测试
    runs-on: ubuntu-latest
    needs: code-quality
    
    strategy:
      matrix:
        node-version: ['18.x', '20.x']
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Prisma生成客户端
      run: npx prisma generate
      
    - name: 运行单元测试
      run: npm test
      env:
        NODE_ENV: test
        
    - name: 运行测试覆盖率
      run: npm run test:cov
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  # ==================== 构建检查 ====================
  build:
    name: 构建检查
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Prisma生成
      run: npx prisma generate
      
    - name: 构建应用
      run: npm run build
      
    - name: 检查构建产物
      run: |
        if [ ! -d "dist" ]; then
          echo "❌ 构建失败：dist目录不存在"
          exit 1
        fi
        echo "✅ 构建成功"

  # ==================== 安全检查 ====================
  security:
    name: 安全检查
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: 依赖安全审计
      run: npm audit --audit-level=moderate
      continue-on-error: false
      
    - name: 检查过时依赖
      run: npm outdated || true

  # ==================== Docker构建测试 (仅在main分支) ====================
  docker-build:
    name: Docker构建测试
    runs-on: ubuntu-latest
    needs: [build, test, security]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: 构建Docker镜像
      uses: docker/build-push-action@v5
      with:
        context: .
        push: false
        tags: tcm-backend:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ==================== 部署准备 (仅在main分支且所有检查通过) ====================
  deploy-staging:
    name: 部署到Staging环境
    runs-on: ubuntu-latest
    needs: [build, test, security, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: 部署准备检查
      run: |
        echo "🚀 准备部署到Staging环境"
        echo "分支: ${{ github.ref }}"
        echo "提交: ${{ github.sha }}"
        echo "✅ 所有检查已通过，可以部署"
        
    # 这里将来可以添加实际的部署步骤
    # - name: Deploy to Render.com
    #   run: |
    #     # 部署到Render.com的脚本

  # ==================== 通知 ====================
  notify:
    name: 通知
    runs-on: ubuntu-latest
    needs: [code-quality, test, build, security]
    if: always()
    
    steps:
    - name: 通知结果
      run: |
        if [ "${{ needs.code-quality.result }}" == "success" ] && \
           [ "${{ needs.test.result }}" == "success" ] && \
           [ "${{ needs.build.result }}" == "success" ] && \
           [ "${{ needs.security.result }}" == "success" ]; then
          echo "✅ CI/CD流水线执行成功！"
        else
          echo "❌ CI/CD流水线执行失败，请检查日志"
          exit 1
        fi 